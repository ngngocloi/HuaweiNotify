name: Build HuaweiNotifyBeta
on:
  push:
    paths:
      - 'app/**'
      - 'tools/**'
      - 'tests/**'
      - '*.gradle'
      - '.github/workflows/android.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test helper and command generation
        run: |
          python3 -m unittest discover -s tests -v
          mkdir -p test-output
          javac -d test-output app/src/main/java/com/ngocloi/huaweinotify/Core.java tests/CoreTest.java
          java -cp test-output CoreTest
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/HuaweiNotifyBeta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HuaweiNotifyBeta
          path: app/build/outputs/apk/debug/HuaweiNotifyBeta.apk
